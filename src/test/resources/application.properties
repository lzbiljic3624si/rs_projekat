# Spring testovi koriste bazu u memoriji, bez uvoza .env.
spring.application.name=rs_projekat-test
app.security.jwt-secret=test-only-jwt-secret-at-least-32-bytes
app.security.jwt-trajanje=PT1H
app.security.cors-origins=http://localhost:3000
spring.datasource.url=jdbc:h2:mem:rs_projekat_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
