spring.application.name=rs_projekat
server.port = 6768

spring.config.import = optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-trajanje=${JWT_TRAJANJE}
app.security.cors-origins=${CORS_ORIGINS}

app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-trajanje=${JWT_TRAJANJE:PT1H}
app.security.cors-origins=${CORS_ORIGINS:http://localhost:3000}
